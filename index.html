
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ideal Tecidos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Ideal Tecidos - Controle</title>
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      window.dispatchEvent(new Event('pwa-prompt-ready'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    try {
      if (localStorage.getItem('ideal_theme_mode') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#E11D48',
              blue: '#0F172A',
              slate: '#F8FAFC',
              dark: '#020617',
              accent: '#3B82F6',
            }
          },
          boxShadow: {
            'modern': '0 8px 30px rgba(0, 0, 0, 0.04)',
            'modern-lg': '0 20px 50px rgba(0, 0, 0, 0.1)',
            'glass': 'inset 0 0 0 1px rgba(255, 255, 255, 0.1)',
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
        width: 100% !important;
        position: static !important;
      }
      body {
        background-color: white !important;
        margin: 0;
        padding: 0;
      }
      #root, .min-h-screen, main {
        max-width: none !important;
        width: 100% !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
      }
      @page {
        margin: 1.5cm;
        size: auto;
      }
    }
    .print-only {
      display: none;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-slate-100 antialiased overflow-x-hidden transition-colors duration-200">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
